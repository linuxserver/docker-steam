  - {date: "04.02.26:", desc: "Add ProtonUp Qt for runtime management and umu-run for custom auto game launching."}
  - {date: "17.01.26:", desc: "Document Nvidia support."}
  - {date: "09.01.26:", desc: "Initial Version."}
